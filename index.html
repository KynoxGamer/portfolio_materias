<h1>portfólio</h1>

<input type="text" id="nome" placeholder="nome">
<br>
<input type="text" id="professor" placeholder="professor">
<br>
<input type="text" id="cargaHoraria" placeholder="cargaHoraria">
<br>
<input type="text" id="nota" placeholder="nota">
<br>
<input type="text" id="aprendizado" placeholder="aprendizado">
<br>
<input type="text" id="imagem" placeholder="imagem">
<br>

<button onclick="cadastrar()">Cadastrar</button>
<button onclick="buscar()">Buscar</button>

<div id="lista"></div>

<script>
    async function cadastrar(){
        const nome = document.getElementById('nome').value
        const professor = document.getElementById('professor').value
        const cargaHoraria = Number(document.getElementById('cargaHoraria').value)
        const nota = Number(document.getElementById('nota').value)
        const aprendizado = document.getElementById('aprendizado').value
        const imagem = document.getElementById('imagem').value

        const materia = {
            nome, professor, cargaHoraria, nota, aprendizado, imagem
        }

        await fetch('http://localhost:3000/materias', {
            method: 'POST',
            body: JSON.stringify(materia),
            headers: {
                'Content-Type': 'application/json'
            }
        })
    }

async function buscar() {
    const resposta = await fetch('http://localhost:3000/materias')
    const materias = await resposta.json()

    const lista = document.getElementById('lista')
    lista.innerHTML = ''

    materias.forEach((materia) => {
        lista.innerHTML += `
        <br>
        <img width="200px" src="${materia.imagem}"> <br>
        matéria: ${materia.nome} <br>
        professor: ${materia.professor} <br>
        carga horária: ${materia.cargaHoraria} horas <br>
        nota: ${materia.nota} <br>
        o que aprendi: ${materia.aprendizado} <br>`
    })
}
</script>
